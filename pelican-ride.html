<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>鹈鹕的海岸骑行</title>
  <style>
    :root { color-scheme: light; background: #f6f1e7; color: #244c49; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; }
    main { width: min(1120px, 100%); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; }
    .edition { font-size: 12px; letter-spacing: .1em; }
    .scene { overflow: hidden; border-radius: 20px; background: #d9eae5; }
    svg { display: block; width: 100%; height: auto; }
    footer { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: 26px 2px 0; }
    h1 { font-size: clamp(24px, 4vw, 42px); font-weight: 500; letter-spacing: -.045em; margin: 0 0 8px; }
    p { margin: 0; color: #64807a; font-size: 13px; line-height: 1.8; }
    .stamp { font-size: 11px; letter-spacing: .15em; white-space: nowrap; border-top: 1px solid #a7b8ae; padding-top: 12px; }
    @media (max-width: 600px) { body { padding: 24px 12px; } header { margin-bottom: 16px; } .edition { font-size: 10px; } .scene svg { width: 155%; max-width: none; margin-left: -27.5%; } footer { align-items: start; } .stamp { display: none; } }
  </style>
</head>
