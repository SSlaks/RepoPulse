name: 缺陷报告
description: 报告一个可复现的缺陷或回归
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        > **隐私警告：** 请勿粘贴 GitHub Token、API Key、数据库连接串、`.env` 内容或其他私有环境变量。
        > 日志与截图请先脱敏。若你怀疑这是安全漏洞，请勿在此公开提交，改用仓库的私密漏洞报告渠道。
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      description: 问题出现在哪种部署方式下？
      options:
        - 在线站点（https://repopulse.slak7.cn）
        - Docker Compose 本地全栈
        - 本地后端 + 前端（开发模式）
        - 仅后端 API / 任务
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 如果知道，请填写你实际使用或测试的提交号；不知道可填「在线站点」或「未知」，请勿猜测。
      placeholder: 例如 main@cec4b13，或「在线站点」「未知」
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: 演示或来源链接
      description: 受影响的页面、仓库详情链接或最小复现用例地址
      placeholder: https://repopulse.slak7.cn/repo/owner/name
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出能稳定触发问题的最小步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志、报错或截图
      description: 请删除其中的密钥、内网地址和个人信息后再粘贴
      placeholder: 粘贴脱敏后的报错信息或拖入截图
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已移除 Token、API Key、数据库连接串和其他敏感信息
          required: true
        - label: 这不是安全漏洞；若涉及安全，我会改用私密漏洞报告渠道
          required: true
