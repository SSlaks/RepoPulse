x-backend-service: &backend-service
  image: repopulse-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repopulse
      POSTGRES_USER: repopulse
      POSTGRES_PASSWORD: repopulse
    ports:
      - "5432:5432"
    volumes:
      - repopulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend-service
    command: ["sh", "-c", "cd /app/backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &backend-env
      ENVIRONMENT: production
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DATABASE_URL: postgresql+psycopg_async://repopulse:repopulse@postgres:5432/repopulse
      SYNC_DATABASE_URL: postgresql+psycopg://repopulse:repopulse@postgres:5432/repopulse
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      EXCLUDED_REPOSITORIES: ${EXCLUDED_REPOSITORIES:-}
      REPOSITORY_AUTO_QUARANTINE: ${REPOSITORY_AUTO_QUARANTINE:-false}
      REPOSITORY_PROBE_ENABLED: ${REPOSITORY_PROBE_ENABLED:-true}
      SNAPSHOT_DEADLINE_HOURS: ${SNAPSHOT_DEADLINE_HOURS:-6}
      RANKING_MIN_COMPLETENESS_PERCENT: ${RANKING_MIN_COMPLETENESS_PERCENT:-95}
      SNAPSHOT_CONCURRENCY: ${SNAPSHOT_CONCURRENCY:-4}
      SNAPSHOT_REQUESTS_PER_SECOND: ${SNAPSHOT_REQUESTS_PER_SECOND:-4}
      SNAPSHOT_BATCH_SIZE: ${SNAPSHOT_BATCH_SIZE:-50}
      SNAPSHOT_FLUSH_SECONDS: ${SNAPSHOT_FLUSH_SECONDS:-5}
      AVATAR_CACHE_DIR: /var/cache/repopulse/avatars
    ports:
      - "8000:8000"
    volumes:
      - repopulse-avatar-cache:/var/cache/repopulse/avatars:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend-service
    command: ["celery", "-A", "worker.app.celery_app.celery_app", "worker", "--loglevel=INFO"]
    environment: *backend-env
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - repopulse-avatar-cache:/var/cache/repopulse/avatars

  beat:
    <<: *backend-service
    command: ["celery", "-A", "worker.app.celery_app.celery_app", "beat", "--loglevel=INFO"]
    environment: *backend-env
    depends_on:
      worker:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  repopulse-postgres:
  repopulse-avatar-cache:
